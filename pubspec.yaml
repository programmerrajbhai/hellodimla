publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: 3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  shared_preferences: ^2.5.6
  sqflite: 2.4.2+1

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_storage: ^13.6.0

  image_picker: ^1.2.4
  google_fonts: ^8.2.1
  url_launcher: ^6.3.3
  share_plus: 11.1.0
  cryptography: 2.9.0
  file_picker: 11.0.2
  pdf: 3.12.0
  path_provider: 2.1.5
